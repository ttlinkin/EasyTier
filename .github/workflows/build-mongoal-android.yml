name: Build Mongoal Android GUI ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build arm64-v8a APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Mongoal resolve-doh
        uses: actions/checkout@v5
        with:
          ref: resolve-doh

      - name: Set build description
        run: |
          echo "GIT_DESC=$(git log -1 --format=%cd.%h --date=format:%Y-%m-%d_%H:%M:%S)" >> "$GITHUB_ENV"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: "21"

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12.0"
          packages: >-
            build-tools;34.0.0
            ndk;26.0.10792818
            platform-tools
            platforms;android-34

      - name: Configure Android environment
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/ndk/26.0.10792818/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.0.10792818" >> "$GITHUB_ENV"

      - name: Prepare Rust and frontend environment
        uses: ./.github/actions/prepare-build
        with:
          target: aarch64-linux-android
          gui: false
          pnpm: true
          pnpm-build-filter: ""
          token: ${{ github.token }}

      - name: Build Android GUI APK
        run: |
          cd easytier-gui
          pnpm tauri android build --apk --target aarch64 --split-per-abi

      - name: Collect APK
        run: |
          mkdir -p output-apk
          cp easytier-gui/src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk output-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: easytier-mongoal-resolve-doh-arm64
          path: output-apk/*.apk
          if-no-files-found: error
